server {
    listen 80;
    server_name admin.hrbank.ca;
    
    # Redirect admin subdomain root to admin login
    location = / {
        return 301 https://hrbank.ca/admin/login;
    }
    
    # All other paths redirect to main domain with same path
    location / {
        return 301 https://hrbank.ca$request_uri;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
}
