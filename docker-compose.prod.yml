version: '3.8'

# Local testing mirror of Lightsail Container Service setup
# In Lightsail, both containers share localhost — network_mode: host mimics this
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qaisijoe/hrbank-backend:latest
    container_name: hrbank-backend
    env_file:
      - backend/.env
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    network_mode: "host"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://hrbank.ca}
    image: qaisijoe/hrbank-frontend:latest
    container_name: hrbank-frontend
    depends_on:
      - backend
    restart: unless-stopped
    network_mode: "host"

volumes:
  uploads:
